translation:
  source_language: Japonés
  target_language: Español
  method: LLM          # LLM | Tradicional
  traditional_provider: auto  # auto | google | deepl
  # Ritmo de salida hacia el proveedor tradicional. Google no usa API oficial ni
  # responde 429 cuando limita: devuelve 200 sin resultado, asi que este es el unico freno.
  traditional_min_interval: 0.5     # segundos minimos entre peticiones
  traditional_block_cooldown: 6.0   # pausa base al detectar bloqueo (se duplica por bloqueo, hasta x8)
  traditional_block_max_wait: 60.0  # tiempo maximo esperando a que pase un bloqueo antes de rendirse
  inpaint_model: lama_mpe
  lore: ""
  glossary: ""

processing:
  input_dir: dataset
  # traducir | limpiar | limpiar_transcribir. La UI lo elige por trabajo.
  modo_pipeline: traducir
  batch_size: 8
  parallel: false
  cache: true
  cache_dir: .cache
  cpu_gpu_pipeline: true
  pipeline_prefetch: 2
  # null = autocalcular según CPU/GPU; entero = límite explícito de procesos paralelos.
  max_workers: null

ocr:
  # Pasar la transcripcion latina a MAYUSCULAS. APAGADO por defecto: parecia obvio, pero
  # medido sobre 31 regiones corregidas a mano EMPEORA (CER 0.568 -> 0.757), porque la
  # correccion humana se escribe en minusculas. Actívalo solo si tu material esta rotulado
  # en mayusculas Y vas a corregir en mayusculas.
  uppercase_latin_transcription: false
  # Hay dos OCR distintos:
  # - detection_engine localiza bounding boxes para limpieza, hints y división de globos.
  # - transcription_engine lee/transcribe el texto final dentro de cada región.
  # detection_engine: auto | easyocr | paddle | paddle_subprocess
  # transcription_engine: auto | easyocr | mangaocr | paddle | paddle_subprocess
  # detection_engine tambien acepta `rtdetr`: localiza el texto bastante mejor que el OCR
  # (sobre las regiones dibujadas a mano del banco empareja 0.45-0.78 donde el segmentador
  # de globos saca 0.000) y no compite por la GPU. No transcribe: la lectura la sigue
  # haciendo transcription_engine. Combinalo con region_source: yolo, que es quien pone el
  # poligono del globo del que depende la limpieza.
  detection_engine: auto
  transcription_engine: auto
  # Para PaddleOCR GPU + YOLO GPU, usa subprocess para aislar Paddle de PyTorch.
  gpu: auto
  paddle_subprocess: auto   # auto | true | false
  fast_mode: false

quality:
  # Fuente de regiones. Las tres son modelos entrenados, aqui no hay heuristica:
  #   rtdetr              -> RT-DETR-v2 de texto y globos (por defecto)
  #   comic_text_detector -> detector de texto (ve globo y fuera de globo) como fuente unica
  #   yolo                -> globos segmentados + texto libre recuperado por el OCR global
  # Con rtdetr y con comic_text_detector el OCR global deja de crear regiones: el detector
  # ya cubre lo que aportaba, y era la fuente de la mayoria de falsos positivos.
  #
  # Ojo al comparar: rtdetr emite cajas del tamano del TEXTO y yolo del tamano del GLOBO.
  # Medido contra `bbox_texto` (donde esta el texto, libre de convencion) rtdetr gana en
  # los cuatro casos del banco; medido contra la caja de globo pierde en los tres casos
  # legado, que tienen el ground truth con la convencion antigua. No son dos calidades.
  region_source: yolo
  # Carpeta donde volcar los recortes que recibe el OCR (enmascarado y preprocesado),
  # para medir variantes de preproceso sin reconstruir regiones fuera del pipeline.
  # Vacio = apagado. Solo para depurar: escribe dos PNG por region.
  ocr_crop_debug_dir: ""
  # Vacio = se descarga a models/detection/ la primera vez (~95 MB, del release beta-0.3
  # de manga-image-translator, el mismo de lama y aot). Corre en cv2.dnn sobre CPU.
  comic_text_detector_model_path: ""
  comic_text_detector_conf: 0.40
  comic_text_detector_mask_threshold: 0.30
  # RT-DETR-v2 (ogkalu/comic-text-and-bubble-detector, Apache-2.0). Vacio = se descarga a
  # models/detection/ la primera vez (~168 MB). Necesita el extra opcional onnxruntime:
  # este modelo NO se puede cargar con cv2.dnn (falla en el nodo CumSum del encoder).
  #   pip install onnxruntime      (o: pip install parallel-manga-translator[onnx])
  rtdetr_text_model_path: ""
  rtdetr_text_conf: 0.30
  rtdetr_bubble_conf: 0.50
  # Deriva la envolvente de la tinta dentro de cada caja y la usa como zona segura. Este
  # modelo da cajas, no mascaras, y una caja como zona segura llena el recorte de OCR de
  # arte vecino: medido en su dia, CER 0.0015 -> 0.2584. Apagalo solo para comparar.
  rtdetr_text_polygon: true
  # Donde buscar la tinta de un bloque que cae dentro de un globo. La caja de texto de este
  # modelo cubre solo ~0.66 del bloque real, asi que buscar solo dentro de ella deja
  # columnas sin borrar; el globo que el propio modelo predice lo cubre entero. No cambia
  # la caja de la region, solo la zona de busqueda.
  rtdetr_bubble_search_zone: true
  rtdetr_bubble_search_min_overlap: 0.80
  # De donde sale la tinta que se borra:
  #   derivada      -> umbral + componentes conectados anclados al OCR (el de siempre)
  #   derivada+ctd  -> ademas, la tinta que ve comic-text-detector. UNION, nunca
  #                    sustitucion: medido sobre el banco, las dos mascaras aciertan
  #                    sitios distintos (IoU 0.27-0.42 con areas casi iguales). Si el
  #                    detector no ve tinta en una region, manda la derivada.
  ink_mask_source: derivada
  # La detección de globos ahora SOLO usa modelo preentrenado. Sin modelo válido se lanza error.
  bubble_detection: true
  bubble_fill: true
  # Limpieza de globo sin parches cuadrados:
  # - false: no se rellena plano todo el globo, solo se borra tinta del texto dentro de la máscara segura.
  # - true: rellena plano el interior si la máscara no parece rectangular.
  bubble_fill_whole_interior: false
  # Margen interno para no tocar el borde negro del globo.
  bubble_fill_edge_margin: 6
  # Dilatación de la máscara de tinta del texto; sube a 3 si quedan halos, baja a 1 si borra demasiado.
  bubble_fill_text_dilate: 2
  # Globos que el detector encontró pero donde el localizador de texto no vio ninguna caja
  # (texto estilizado, contraste bajo). Se busca tinta en el interior del globo y se borra
  # sólo si ocupa como mucho esta fracción del interior; por encima se asume que no es texto.
  # 0 desactiva el rescate y deja esos globos sin limpiar, como antes.
  bubble_ink_without_ocr_max_ratio: 0.35
  # Opciones avanzadas para suavizado y relleno de máscara.
  bubble_fill_feather: 1.0
  bubble_fill_flat_max_rectangularity: 0.86
  # Como borrar la tinta dentro del globo usando clean_mask. Elige el PRIMER candidato,
  # no el resultado final: con visual_inpaint_verifier activo (el valor por defecto) el
  # verificador puede rechazarlo y visual_inpaint_retry sustituirlo por otro, incluso
  # por un modelo distinto del configurado. Medido: con 'solid' sobre una trama acaba
  # en aot, y con 'inpaint' sobre fondo uniforme acaba en relleno solido.
  # - inpaint: parte de translation.inpaint_model, por ejemplo lama_mpe, sobre la tinta.
  # - auto: parte de relleno solido en fondos uniformes y de inpaint en fondos complejos.
  # - solid: parte de color solido local.
  # Para que la estrategia sea la ultima palabra, pon visual_inpaint_retry: false.
  bubble_fill_strategy: inpaint
  # Solo se usa con bubble_fill_strategy: auto.
  # Sube si inpainta demasiados globos blancos; baja si quedan manchas planas en tramas/degradados.
  bubble_fill_background_std_threshold: 18.0
  # Contexto alrededor del globo/texto usado al inpaintar fondos complejos.
  bubble_fill_inpaint_padding: 18
  # Verificador visual post-limpieza: detecta halos, restos de tinta, textura rota,
  # parches planos y bordes de globo dañados. Si falla, prueba candidatos alternos.
  visual_inpaint_verifier: true
  visual_inpaint_retry: true
  # Orden de reintentos; admite solid, opencv/opencv-tela, lama_mpe, lama_large_512px y aot.
  visual_inpaint_retry_models: "solid,opencv-tela,lama_mpe,aot"
  # Reintentos extra además del primer candidato elegido por bubble_fill_strategy.
  visual_inpaint_max_retries: 4
  # 1.0 = exige que todas las comprobaciones estén bajo su umbral interno.
  visual_inpaint_accept_score: 1.0
  # Sobre fondo con textura ningún relleno domina: cada candidato es el mejor en una parte de
  # los casos, y el verificador corta en el primero que aprueba. true prueba todos ahí y se
  # queda con el mejor.
  # Medido en los dos casos del banco: el verificador sube 0.5755 -> 0.5943 en ja_01 y no se
  # mueve en en_01, a cambio de un +26% de tiempo en todas las páginas. Por eso viene apagado:
  # actívalo sólo si priorizas calidad sobre velocidad.
  visual_inpaint_best_of_textured: false
  # true guarda métricas e imágenes/crops por región en salida/debug_inpaint/.
  visual_inpaint_debug: false
  bubble_detector: yolo11-seg
  require_yolo: true
  bubble_first: true
  # bubble: OCR en el globo/máscara completa; text_hint: OCR en caja de texto asociada si existe.
  ocr_region_mode: bubble
  # Detector principal: YOLO11-seg fine-tuned o cualquier peso Ultralytics-seg compatible.
  # Usa bubble_model_path para pesos locales, o bubble_model_repo/bubble_model_file para Hugging Face.
  bubble_model_repo: huyvux3005/manga109-segmentation-bubble
  bubble_model_file: best.pt
  bubble_model_path: ""
  # Usa 0/cuda/cuda:0/gpu para GPU, cpu para CPU, o vacío/auto para que Ultralytics decida.
  bubble_device: ""
  bubble_confidence: 0.35
  bubble_img_size: 1024
  # Máscaras de alta resolución de Ultralytics; mejora bordes al limpiar.
  bubble_retina_masks: true
  # Opcional: IDs numéricos de clases YOLO a pasar a inferencia, por ejemplo "0,1".
  bubble_model_classes: ""
  # Opcional: labels permitidos si tu modelo fine-tuned tiene muchas clases. Vacío = acepta todas salvo excludes.
  bubble_include_labels: ""
  # --- Color del texto original ---
  # false: el rotulado elige blanco o negro segun el brillo del fondo (comportamiento
  # historico). true: estima el color real de la tinta y del contorno mirando la imagen
  # ORIGINAL a traves de la mascara de tinta, y rotula con ellos. Util en manga a color,
  # rotulos de color y SFX perfilados. Si no hay senal suficiente en una region, esa cae
  # a la regla de contraste, no se inventa un color.
  # OJO: el banco de pruebas NO cubre esto; eval_runner se detiene antes de rotular.
  estimate_text_colors: false
  # Evita que clases de arte/página/panel entren al limpiador.
  bubble_exclude_labels: "ignore_art,panel,page,background"
  # Rechaza detecciones demasiado grandes respecto a la página completa.
  bubble_max_area_ratio: 0.55
  # auto: globo por relleno + SFX por inpainting rápido
  # quality: usa el modelo de inpainting para SFX
  # bubble_only: solo limpia interiores de globos, máximo rendimiento
  # No hay modo heurístico: los globos dependen del detector YOLO.
  inpaint_mode: auto

  # Control técnico para evitar que globos cercanos terminen como una sola región.
  # En flujo normal esto no muestra nada al usuario; solo afecta la lógica interna.
  # La división se hace por clusters lógicos de OCR: columnas cercanas del mismo globo
  # se mantienen juntas, pero bloques separados pasan a regiones independientes.
  split_merged_bubbles: true
  bubble_split_min_ocr_groups: 2
  # Si dos grupos OCR dentro de una misma región detectada están separados por al menos este gap,
  # se asumen globos independientes y la región se divide. Sube este valor si divide demasiado.
  bubble_split_min_gap_px: 18
  bubble_split_gap_ratio: 0.70
  # Segunda etapa: cuando ya se agruparon columnas de un mismo globo, estos umbrales
  # deciden si dos clusters lógicos dentro de una misma detección son globos distintos.
  # Bajar estos valores divide más globos cercanos; subirlos divide menos.
  bubble_split_cluster_min_gap_px: 12
  bubble_split_cluster_gap_ratio: 0.35
  bubble_split_pad_x: 0.85
  bubble_split_pad_y: 1.05
  bubble_split_min_pad: 18
  # Agrupación OCR conservadora: subir valores separa más textos/globos cercanos; bajar valores une más.
  # Importante para manga vertical: por defecto NO se fusionan columnas CJK adyacentes solo por cercanía.
  ocr_group_merge_x_overlap: 0.52
  ocr_group_merge_y_gap_ratio: 0.25
  ocr_group_merge_cjk_y_overlap: 0.80
  ocr_group_merge_cjk_x_gap_ratio: 0.35
  ocr_group_merge_cjk_columns: false
  ocr_group_merge_line_y_overlap: 0.72
  ocr_group_merge_line_x_gap_ratio: 0.20
  ocr_group_merge_line_horizontal_only: true
  # Filtros para texto libre fuera de globos. Permiten páginas de notas/afterword con líneas largas,
  # pero siguen rechazando manchas enormes sin señal OCR fiable.
  free_text_max_area_ratio: 0.12
  free_text_hard_max_area_ratio: 0.22
  free_text_max_width_ratio: 0.96
  free_text_max_height_ratio: 0.60
  free_text_min_confidence: 0.08
  free_text_large_min_confidence: 0.16
  # Recupera columnas de texto libre que el OCR global no detectó, solo cuando
  # aparecen como tinta vertical en el hueco entre dos textos libres/SFX ya detectados.
  free_text_gap_recovery: true
  free_text_gap_max_px: 220
  free_text_gap_min_y_overlap: 0.45
  free_text_gap_min_ink_density: 0.025
  free_text_gap_max_ink_density: 0.90
  # Activa archivos técnicos para tests en dataset/outputs/debug_globos.
  bubble_merge_debug: false
  bubble_merge_debug_dir: ""
  bubble_merge_debug_pair_limit: 160

  # Detección fina de texto: usa polígonos OCR como semilla, no solo bboxes rectangulares.
  fine_text_detection: true
  fine_text_mask_dilate: 2
  # Refina clean_mask con componentes conectados anclados a polígonos OCR/text_bbox.
  ink_mask_refinement: true
  ink_mask_min_component_area: 3
  ink_mask_component_anchor_overlap: 0.03
  ink_mask_component_anchor_max_gap_ratio: 0.45
  # El texto suele llevar halo (blanco sobre trama, negro sobre fondo claro) que queda fuera
  # de la caja del OCR. Si no se borra, el inpainter tiene halo pegado al borde del agujero y
  # lo propaga hacia dentro: quedan manchas con la forma de las letras. La máscara crece hacia
  # él por reconstrucción, sólo por píxeles contiguos que no se parecen al fondo, hasta este
  # límite en píxeles. 0 desactiva el crecimiento.
  text_halo_growth_px: 10
  # Orden de lectura por paneles detectados con OpenCV; si falla, cae al orden base de PMT.
  panel_aware_reading_order: true
  panel_detection_min_area_ratio: 0.015
  panel_detection_max_area_ratio: 0.96
  panel_detection_gutter_px: 10
  # Render tipográfico: cortes suaves, balance de líneas y espaciado.
  typography_smart_wrap: true
  typography_hyphenation: true
  typography_balance_lines: true
  typography_line_spacing_factor: 1.0

onomatopoeia:
  # translate | keep | subtitle | auto
  mode: translate
  translate: true
  # false conserva el arte SFX/onomatopeyas: no limpia ni borra esas zonas.
  # Si se omite, keep/translate:false lo desactiva automáticamente.
  clean: true

llm:
  provider: groq
  model: qwen/qwen3.8-27b
  seed: 7
  # Intentos totales controlados por PMT. El SDK de Groq se crea con max_retries=0.
  max_retries: 5
  # Para 429 temporales se respeta retry-after. Una espera superior a este límite
  # se considera demasiado larga y la página se deja intacta.
  retry_max_wait_seconds: 90
  retry_base_seconds: 1.0
  retry_max_backoff_seconds: 12.0
  retry_jitter_seconds: 0.35
  # false evita mezclar silenciosamente LLM con Google/DeepL si Groq falla.
  fallback_to_traditional_on_error: false
  # Qwen 3.8 usa JSON Schema estricto en Groq.
  strict_json_schema: true

character_memory:
  # Construye automáticamente memoria de personajes/hablantes usando IA en modo LLM.
  enabled: true
  # Vacío = dataset/character_memory.json. Usa una ruta explícita si quieres compartir memoria entre tomos.
  path: ""
  max_context_pages: 8

evaluation:
  # Dataset de regresión validado a mano, NO la carpeta que procesa el usuario:
  # `processing.input_dir` es el manga que se traduce; esto es el banco de pruebas
  # contra el que se mide si un cambio mejora o empeora. Ver dataset_eval/README.md.
  dataset_dir: dataset_eval
  # Umbral de IoU para dar por detectada una región.
  iou_threshold: 0.50
  # Diferencia por debajo de la cual un cambio se considera ruido, no señal.
  tolerance: 0.005

export:
  pdf: true
  cbz: false
  skip_pdf: false

logging:
  level: INFO
  file: debug.log

# Refinamiento semantico con modelo multimodal. Clasifica cada bloque ya localizado en
# dialogue/thought/narration/sfx mirando la pagina completa, que es el contexto que no
# tienen ni el detector ni el OCR por recortes.
#
# APAGADO por defecto: cuesta una llamada de API por pagina. No sustituye al OCR; la
# transcripcion sigue saliendo de MangaOCR/Paddle, que mide CER 0.0015 en el banco.
vlm:
  enabled: false
  provider: groq
  # OBLIGATORIO y sin valor por defecto. Comprobado el 2026-09-12 contra la API: esta
  # cuenta de Groq no ofrece ningun modelo multimodal (solo texto, voz y prompt-guards),
  # y `meta-llama/llama-4-scout-17b-16e-instruct` responde 404 model_not_found.
  # Pon aqui el id exacto de un modelo con entrada de imagen cuando lo tengas.
  model: ""
  temperature: 0.0
  max_tokens: 2048
  timeout: 60.0
  # Recortes ampliados que acompanan a la pagina anotada, solo para bloques dificiles
  # (sin transcripcion, o fuera de globo). 0 = enviar solo la pagina.
  max_crops: 6
  # true = el VLM SOLO rellena transcripciones vacias. Nunca pisa una que el OCR produjo.
  refine_transcription: false
  # Lado maximo de la pagina anotada que se sube. Mas grande no mejora la lectura de los
  # numeros y multiplica coste y latencia.
  page_max_side: 1024
