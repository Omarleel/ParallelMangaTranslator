[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "parallel-manga-translator"
version = "0.6.0"
description = "Pipeline de traducción de manga con detección de globos, OCR, traducción, cola persistente y renderizado."
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
  "easyocr",
  "manga-ocr",
  "deep-translator",
  "Pillow>=10.0",
  "requests>=2.31",
  "wget",
  "colorama",
  "nest-asyncio",
  "python-dotenv",
  "pydrive2",
  "groq",
  "loguru",
  "numpy<2",
  "PyYAML>=6.0",
  "ultralytics>=8.3.0",
  "huggingface-hub>=0.23.0",
  "transformers>=4.30,<4.46",
  "opencv-python-headless>=4.8",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "build>=1.2", "ruff>=0.16"]
paddle = ["paddleocr==2.10.0", "albumentations==1.4.24", "albucore==0.0.23"]

[project.scripts]
pmt = "parallel_manga_translator.cli:main"
parallel-manga-translator = "parallel_manga_translator.cli:main"
pmt-evaluate = "parallel_manga_translator.quality.evaluation_manager:main"
pmt-eval-dataset = "parallel_manga_translator.quality.eval_dataset:main"
pmt-ui = "parallel_manga_translator.ui.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["parallel_manga_translator*"]

[tool.setuptools.package-data]
parallel_manga_translator = [
  "resources/**/*.yaml",
  "resources/**/*.md",
  "ui/static/*.html",
  "ui/static/*.js",
  "ui/static/*.css",
]

[tool.ruff]
# El percentil 99 de las lineas del proyecto es 119 caracteres.
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# Conjunto de arranque deliberadamente estrecho: reglas que senalan errores, no estilo.
# Medido sobre el codigo actual: F=304 (casi todo imports sin usar, auto-corregible),
# B=35, SIM=33, C4=14. Se dejan fuera E/W (575 avisos, casi todos espaciado) y UP (1188),
# porque un linter que grita mil avisos cosmeticos no lo ejecuta nadie y deja de cazar
# los que importan. Ampliar el conjunto cuando el residuo actual este en cero.
#
# Lo que ya encontro al activarlo: tres F821 (nombres sin definir) que eran bugs reales,
# uno de ellos dejaba PatchMatchInpainter roto en cualquier uso.
select = ["F", "B", "SIM", "C4"]

[tool.ruff.lint.per-file-ignores]
# Los tests construyen dobles y fixtures donde una asignacion sin usar es legitima.
"tests/*" = ["B011"]
# Definiciones de arquitectura de red (LaMa, AOT, FFC). Los defaults mutables tipo
# norm_layer=nn.BatchNorm2d son el idioma normal de PyTorch y cambiarlos toca el modelo.
"parallel_manga_translator/inpainting/aot.py" = ["B006", "B008"]
"parallel_manga_translator/inpainting/lama.py" = ["B006", "B008"]
"parallel_manga_translator/inpainting/ffc.py" = ["B006", "B008", "F841"]
# FastAPI declara los parametros con File()/Depends() como valor por defecto: es su API,
# no un descuido.
"parallel_manga_translator/ui/app.py" = ["B008"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
